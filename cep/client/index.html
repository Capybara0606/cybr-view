<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:;
                 connect-src https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
                 img-src 'self' data:;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline'">
  <title>CYBR VIEW</title>
  <link rel="stylesheet" href="css/panel.css">
  <style>
    #boot-log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #000; color: #1DB954;
      font: 10px/1.4 Consolas, monospace;
      padding: 6px 10px;
      max-height: 100px; overflow-y: auto;
      z-index: 9999;
      border-top: 1px solid #262626;
    }
  </style>
</head>
<body>

  <div id="boot-log">BOOT...</div>

  <header class="header">
    <div class="header-row">
      <span class="header-brand">CYBR_ VIEW <span class="header-tag">// SYSTEM</span></span>
      <span class="conn-dot" id="conn-dot" title="Connection status"></span>
    </div>
  </header>

  <!-- AUTH -->
  <section class="auth-panel" id="auth-panel">
    <div class="module-label">/00 AUTH</div>
    <form id="auth-form" class="auth-form">
      <input type="email" id="auth-email" placeholder="EMAIL" autocomplete="email" required>
      <input type="password" id="auth-pass" placeholder="PASSWORD" autocomplete="current-password" required>
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" class="btn btn-full">CONNECT</button>
    </form>
  </section>

  <!-- MAIN PANEL (hidden until auth) -->
  <main class="panel" id="main-panel" style="display:none;">

    <section class="module">
      <div class="module-label">/01 PROJECT</div>
      <select class="sel" id="sel-project"><option value="">— SELECT PROJECT —</option></select>
    </section>

    <section class="module">
      <div class="module-label">/02 VERSION</div>
      <select class="sel" id="sel-version" disabled><option value="">— SELECT VERSION —</option></select>
    </section>

    <section class="module">
      <div class="module-label">/03 COMMENTS <span class="count" id="comments-count">00</span></div>
      <div class="comment-list" id="comment-list">
        <div class="empty-state" id="empty-state">NO COMMENTS</div>
      </div>
    </section>

    <section class="module">
      <div class="module-label">/04 CREATE</div>
      <div class="create-form" id="create-form">
        <div class="form-row">
          <span class="form-label">PROJECT //</span>
          <input type="text" id="create-project-name" class="sel" placeholder="Project name" />
        </div>
        <div class="form-row">
          <span class="form-label">CLIENT //</span>
          <input type="text" id="create-project-client" class="sel" placeholder="Client (optional)" />
        </div>
        <div class="form-row">
          <span class="form-label">VERSION //</span>
          <input type="text" id="create-version-name" class="sel" placeholder="V01" />
        </div>
        <div class="form-row">
          <span class="form-label">VIDEO URL //</span>
          <input type="text" id="create-video-url" class="sel" placeholder="https://..." />
        </div>
        <div class="form-row">
          <span class="form-label">FPS //</span>
          <input type="number" id="create-fps" class="sel" value="25" min="1" max="120" />
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button class="btn btn-full" id="btn-create-project" type="button">CREATE PROJECT + VERSION</button>
        </div>
        <div class="create-result" id="create-result" hidden>
          <span class="form-label">REVIEW LINK //</span>
          <input type="text" id="create-review-link" class="sel" readonly />
          <button class="btn btn-sm" id="btn-copy-link" type="button" style="margin-top:4px;">COPY</button>
        </div>
      </div>
    </section>

    <section class="module">
      <div class="module-label">/05 SYSTEM</div>
      <div class="row"><span class="key">STATUS //</span><span class="val" id="sys-status">—</span></div>
      <div class="row"><span class="key">USER //</span><span class="val" id="sys-user">—</span></div>
      <div class="row"><span class="key">PROJECT //</span><span class="val" id="sys-project">—</span></div>
      <div class="row"><span class="key">VERSION //</span><span class="val" id="sys-version">—</span></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-sm" id="btn-logout">DISCONNECT</button>
      </div>
    </section>

  </main>

  <script>
    var _log = document.getElementById('boot-log');
    function _b(msg) { _log.textContent += '\n> ' + msg; _log.scrollTop = _log.scrollHeight; }
    _b('scripts starting...');
  </script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script>_b('firebase-app: ' + (typeof firebase !== 'undefined' ? 'OK' : 'MISSING'));</script>
  <script src="js/vendor/firebase-database-compat.js"></script>
  <script>_b('firebase-db: ' + (typeof firebase !== 'undefined' && firebase.database ? 'OK' : 'MISSING'));</script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script>_b('firebase-auth: ' + (typeof firebase !== 'undefined' && firebase.auth ? 'OK' : 'MISSING'));</script>
  <script src="js/firebase.js"></script>
  <script>_b('CYBRFirebase: ' + (typeof CYBRFirebase !== 'undefined' ? 'OK' : 'MISSING'));</script>
  <script src="js/sync.js"></script>
  <script>_b('CYBRSync: ' + (typeof CYBRSync !== 'undefined' ? 'OK' : 'MISSING'));</script>
  <script src="js/CSInterface.js"></script>
  <script>_b('CSInterface: ' + (typeof CSInterface !== 'undefined' ? 'OK' : 'MISSING'));</script>
  <script src="js/bridge.js"></script>
  <script>_b('CYBRBridge: ' + (typeof CYBRBridge !== 'undefined' && CYBRBridge.available() ? 'PREMIERE' : 'STANDALONE'));</script>
  <script src="js/main.js"></script>
  <script>_b('main.js loaded');</script>
</body>
</html>
